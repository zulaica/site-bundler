name: Lint Code Base

on: pull_request

jobs:
  lint_javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: volta-cli/action@v5
      - name: Install dependencies
        run: npm ci
      - name: Run lint script
        run: npm run lint
